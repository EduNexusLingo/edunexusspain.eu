<!DOCTYPE html>
<html lang="es" data-lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gracias · Edu Nexus Spain</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-950: #050b1b;
      --navy-900: #071329;
      --navy-800: #0c1b3a;
      --navy-700: #132957;
      --ink: #f5f8ff;
      --muted: #aab9d8;
      --muted-2: #7588ad;
      --cyan: #54e5ef;
      --cyan-strong: #12c9da;
      --blue: #7d86ff;
      --yellow: #ffe56a;
      --line: rgba(175, 202, 255, .16);
      --shadow: 0 24px 80px rgba(0, 0, 0, .35);
      --radius-lg: 22px;
      --ease-out: cubic-bezier(.23, 1, .32, 1);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      min-width: 320px;
      display: grid;
      place-items: center;
      padding: 32px;
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      background:
        radial-gradient(circle at 15% 4%, rgba(84, 229, 239, .13), transparent 26rem),
        radial-gradient(circle at 88% 12%, rgba(125, 134, 255, .15), transparent 32rem),
        linear-gradient(160deg, var(--navy-950), var(--navy-900) 55%, var(--navy-800));
    }
    .card {
      width: 100%;
      max-width: 560px;
      text-align: center;
      padding: 54px 44px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: linear-gradient(145deg, rgba(21, 50, 102, .68), rgba(8, 20, 45, .72));
      box-shadow: var(--shadow);
    }
    .badge {
      width: 84px;
      height: 84px;
      margin: 0 auto 26px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid rgba(84, 229, 239, .55);
      background: radial-gradient(circle at 35% 25%, rgba(84, 229, 239, .28), rgba(9, 26, 60, .9) 70%);
      box-shadow: 0 0 0 10px rgba(84, 229, 239, .06), 0 0 42px rgba(84, 229, 239, .3);
    }
    .badge svg { width: 40px; height: 40px; stroke: var(--cyan); }
    h1 {
      margin: 0 0 14px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 30px;
      line-height: 1.15;
    }
    p {
      margin: 0 auto 30px;
      max-width: 400px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }
    .button {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 14px 26px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      color: var(--navy-950);
      background: var(--cyan);
      border-radius: 999px;
      transition: transform .25s var(--ease-out), background .25s var(--ease-out);
    }
    .button:hover { transform: translateY(-2px); background: var(--cyan-strong); }
    .lang-switch {
      margin-top: 30px;
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .lang-switch button {
      padding: 6px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .06em;
      color: var(--muted-2);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      transition: color .2s, border-color .2s;
    }
    .lang-switch button.active { color: var(--cyan); border-color: rgba(84, 229, 239, .5); }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 9 17l-5-5"></path>
      </svg>
    </div>
    <h1 data-es="¡Mensaje enviado!" data-en="Message sent!">¡Mensaje enviado!</h1>
    <p data-es="Gracias por escribirnos. Hemos recibido tu mensaje y te responderemos lo antes posible." data-en="Thank you for reaching out. We have received your message and will get back to you as soon as possible.">Gracias por escribirnos. Hemos recibido tu mensaje y te responderemos lo antes posible.</p>
    <a class="button" href="https://edunexusspain.eu/">
      <span aria-hidden="true">←</span>
      <span data-es="Volver al inicio" data-en="Back to home">Volver al inicio</span>
    </a>
    <div class="lang-switch">
      <button type="button" data-lang-button="es">ES</button>
      <button type="button" data-lang-button="en">EN</button>
    </div>
  </main>
  <script>
    const root = document.documentElement;
    const translatable = document.querySelectorAll('[data-es][data-en]');
    const langButtons = document.querySelectorAll('[data-lang-button]');
    function setLanguage(lang) {
      root.lang = lang;
      root.dataset.lang = lang;
      translatable.forEach((el) => {
        const val = el.dataset[lang];
        if (val !== undefined) el.textContent = val;
      });
      langButtons.forEach((b) => b.classList.toggle('active', b.dataset.langButton === lang));
      document.title = lang === 'en' ? 'Thank you · Edu Nexus Spain' : 'Gracias · Edu Nexus Spain';
      try { localStorage.setItem('edunexus-language', lang); } catch (e) {}
    }
    langButtons.forEach((b) => b.addEventListener('click', () => setLanguage(b.dataset.langButton)));
    let saved = 'es';
    try { saved = localStorage.getItem('edunexus-language') || 'es'; } catch (e) {}
    setLanguage(saved === 'en' ? 'en' : 'es');
  </script>
</body>
</html>
